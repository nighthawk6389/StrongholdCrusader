<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Garrison Zero" />
    <meta name="application-name" content="Garrison Zero" />
    <meta name="description" content="Garrison Zero: build an outpost in the desert, wall it in and hold the night. A present-day castle-siege RTS for your browser and phone." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Garrison Zero" />
    <meta property="og:description" content="Build. Wall in. Hold the night. A present-day castle-siege RTS for your browser and phone." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Garrison Zero" />
    <meta name="twitter:image" content="/og-image.jpg" />
    <title>Garrison Zero</title>
  </head>
  <body>
    <!-- Shown while the game downloads and builds its scene; removed once the app is up. -->
    <div id="boot" aria-live="polite">
      <img src="/icon.svg" alt="" width="88" height="88" />
      <div class="boot-name">GARRISON <span>ZERO</span></div>
      <div class="boot-bar"><div></div></div>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(900px 500px at 50% 30%, #3a2c1b, #14110d 70%);
        color: #ece5d2;
        font: 800 22px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 6px;
        transition: opacity 0.35s;
      }
      #boot .boot-name span { color: #d9b26f; }
      #boot .boot-bar { width: 160px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      #boot .boot-bar div { width: 40%; height: 100%; background: #d9b26f; animation: boot-slide 1.1s ease-in-out infinite; }
      #boot.gone { opacity: 0; pointer-events: none; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>
      <div id="input-overlay"></div>
      <div id="hud-root"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
